[project]
name = "blender-studio-mcp"
version = "0.1.0"
description = "Lets Claude and other AI models make good-looking 3D art in Blender: lighting, materials, camera and a look-and-fix loop."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=1.2.0,<2",
    "pillow>=10.0",
]

[project.scripts]
blender-studio-mcp = "blender_studio.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blender_studio"]
